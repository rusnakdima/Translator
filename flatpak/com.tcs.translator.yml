app-id: com.tcs.translator
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: translator

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network
  - --filesystem=home

modules:
  - name: translator-local
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin
    build-commands:
      - install -Dm755 target/release/translator /app/bin/translator
      - install -Dm644 com.tcs.translator.desktop /app/share/applications/com.tcs.translator.desktop
      - install -Dm644 com.tcs.translator.metainfo.xml /app/share/metainfo/com.tcs.translator.metainfo.xml
    sources:
      - type: dir
        path: "."
      - type: dir
        path: "target/release"
        dest: "target/release"
