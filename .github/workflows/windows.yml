name: Build for Windows

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: blacksmith-2vcpu-windows-2025
    env:
      NAME_APP: translator

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./target"

      - name: Build app
        run: |
          cargo build --release

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#refs/tags/v}"
          cd target/release
          powershell -Command "Compress-Archive -Path translator.exe -DestinationPath ('../../dist/translator-' + '${VERSION}' + '-windows-x86_64.zip') -Force"
          ls -la ../../dist/

      - name: Upload to Existing Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/translator-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
